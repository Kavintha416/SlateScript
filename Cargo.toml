# ─────────────────────────────────────────────────────────────
#  Package: the `slate` binary itself
# ─────────────────────────────────────────────────────────────
[package]
name = "slate"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"

[[bin]]
name = "slate"
path = "src/main.rs"

[dependencies]
slate-core   = { path = "crates/slate-core" }
slate-sfile  = { path = "crates/slate-sfile" }
slattery     = { path = "crates/slattery" }

# ─────────────────────────────────────────────────────────────
#  Workspace
# ─────────────────────────────────────────────────────────────
[workspace]
resolver = "2"
members = [
    "crates/slate-core",
    "crates/slate-sfile",
    "crates/slattery",
    "crates/slattery-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"