[package]
name = "slate"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "SlateScript Programming Language"

[[bin]]
name = "slate"
path = "src/main.rs"

[dependencies]
slate-core = { path = "./slate-core" }
slattery = { path = "./slattery" }
slate-sfile = { path = "./slate-sfile" }
clap = { version = "4.4", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
reqwest = { version = "0.11", features = ["json", "blocking"] }

[workspace]
resolver = "2"
members = [
    ".",
    "slate-core",
    "slattery",
    "slate-sfile",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "SlateScript Programming Language"

[workspace.dependencies]
clap = { version = "4.4", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"